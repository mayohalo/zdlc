[package]
name = "zdlc-wasm"
description = "zDLC's protocol core for WebAssembly: a stateless contract API, templates, payment links and attestation checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zdlc = { path = "../zdlc", default-features = false }
pczt = { version = "=0.10.0-pre.1", features = ["orchard", "transparent", "io-finalizer", "prover", "signer", "spend-finalizer", "tx-extractor", "zcp-builder"] }
orchard = { version = "=0.16.0", default-features = false, features = ["circuit", "std"] }
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
secp256k1 = { version = "0.33", features = ["alloc"] }
secp256k1-zkp = { version = "0.11.2", features = ["std"] }
wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser randomness for every getrandom in the tree.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
