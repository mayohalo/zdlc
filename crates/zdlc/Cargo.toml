[package]
name = "zdlc"
description = "Discreet Log Contracts on Zcash: v6 transactions through pczt, ECDSA adaptor CETs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Zcash stack, pinned exactly: the NU7 (ZIP 259) pre-releases.
zcash_primitives = { version = "=0.31.0-pre.1", features = ["transparent-inputs"] }
zcash_transparent = { version = "=0.11.0-pre.1", features = ["transparent-inputs"] }
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zcash_address = "=0.14.0-pre.1"
zcash_script = { version = "0.6", default-features = false }
pczt = { version = "=0.10.0-pre.1", features = ["orchard", "transparent", "io-finalizer", "prover", "signer", "spend-finalizer", "tx-extractor", "zcp-builder"] }
orchard = { version = "=0.16.0", features = ["circuit"] }
# secp256k1 0.33 is what pczt and zcash_transparent sign with.
secp256k1 = { version = "0.33", features = ["alloc"] }
# ECDSA adaptor signatures and the dev oracle; on secp256k1 0.29, so keys and
# signatures cross between the two as bytes.
secp256k1-zkp = { version = "0.11.2", features = ["std"] }
# Digit decomposition and numeric CET tries for Phase 1. rust-dlc v0.8.0 = commit
# 8e6a75fbc9685e6eafa348edd45a793fcb63fa4d (also its HEAD as of 2026-10-20). Pulls in
# dlc 0.8.0, bitcoin 0.32 and miniscript 12; shares secp256k1-zkp 0.11 with the adaptor.
dlc-trie = "=0.8.0"
dlc = "=0.8.0"
sha2 = "0.10"
rand10 = { package = "rand", version = "0.10" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_note_encryption = "=0.5.1"
# Witnesses for spending Ironwood notes (the version orchard uses).
incrementalmerkletree = "=0.9.0"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "process"] }
# The oracle service (zdlc-oracled) and its sealed state.
axum = "0.8"
chacha20poly1305 = "0.10"
# Payment links (ZIP 321) and their QR codes.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
percent-encoding = "2.3"
base64 = "0.22"

[dev-dependencies]
# Forging PCZT metadata in tests (tests/protocol.rs).
postcard = { version = "1", features = ["alloc"] }
# A maintained dlcspecs oracle implementation (DLC Dev Kit), for the compatibility test.
kormir = "=1.1.2"
