[package]
name = "zdlc-demos"
description = "The three private market demos (escrow room, hedge desk, auction) in one server, zdlc-room"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "zdlc-room"
path = "main.rs"

[dependencies]
zdlc = { path = "../crates/zdlc" }
zdlc-kit = { path = "../crates/zdlc-kit" }
secp256k1 = { version = "0.33", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "process", "signal"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
rand10 = { package = "rand", version = "0.10" }
